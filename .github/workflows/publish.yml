name: Build & Publish to NuGet

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build src/JFToolkit.WordToCUpdater/JFToolkit.WordToCUpdater.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
        continue-on-error: true

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set version from workflow input
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "PACKAGE_VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV

      - name: Pack
        run: |
          dotnet pack src/JFToolkit.WordToCUpdater/JFToolkit.WordToCUpdater.csproj `
            --configuration Release `
            --no-build `
            -p:PackageVersion=${{ env.PACKAGE_VERSION }} `
            -p:Authors="Harald Daltveit" `
            --output ./nupkgs

      - name: Push to NuGet
        run: |
          $nupkg = Get-ChildItem ./nupkgs/*.nupkg | Select-Object -First 1
          dotnet nuget push $nupkg `
            --api-key ${{ secrets.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
